[metadata]
name = tcpliveplay
version = 0.1.0
description = Replay TCP streams from PCAP files on a live network interface
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
python_requires = >=3.6

[options]
package_dir =
    = src
packages = find:
install_requires =
    scapy

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tcp-exec = tcpliveplay.tcp_exec:main
